secondary_sources:

  - name: Reuters
    domain: reuters.com
    urls:
      - https://www.reuters.com/technology/artificial-intelligence/
    source_type: secondary
    priority: high

  - name: CNBC
    domain: cnbc.com
    urls:
      - https://www.cnbc.com/ai-artificial-intelligence/
      # 2026-10-15, user-reported coverage gap: "Bank earnings live
      # updates" (.../2026/10/13/bank-earnings-live-updates.html, real,
      # confirmed via live fetch -- datePublished 2026-10-13T08:59:01Z)
      # was never discovered. Live-verified it is not linked from the AI
      # hub above (it's general banking/earnings content, not AI-tagged),
      # not in CNBC's own news sitemap, and the "CNBCsitemapAll*.xml"
      # archive sitemaps are a dead end for recency (confirmed frozen at
      # 2024 content, two years stale). This earnings hub DOES link it,
      # alongside other real, dated, often AI-adjacent earnings coverage
      # (TSMC's AI-boom sales record, Oracle's AI-cloud results) --
      # exactly the "Q3 earnings etc." coverage originally reported
      # missing. Handled by the existing generic hub-page link discovery
      # (retrieval.discovery.discover_candidates), same as FT's second
      # (Technology) URL above -- not a dedicated scraper.
      - https://www.cnbc.com/earnings/
    source_type: secondary
    priority: high

  - name: Bloomberg
    domain: bloomberg.com
    urls:
      - https://www.bloomberg.com/ai
    source_type: secondary
    priority: high

  - name: Financial Times
    domain: ft.com
    urls:
      - https://www.ft.com/artificial-intelligence
      # Technology section/landing page (category: Technology) -- additive
      # discovery surface alongside the AI topic hub above, same source,
      # same name. Handled by the existing generic hub-page link discovery
      # (retrieval.discovery.discover_candidates: each configured URL is
      # fetched and scanned for same-domain article-shaped links) -- this
      # is not a dedicated FT scraper, and the section URL itself is never
      # treated as an article (see discovery.py's own-URL exclusion). Real
      # per-article publication dates come from the existing generic
      # extraction metadata (<time>, JSON-LD, article:published_time, ...)
      # in retrieval.extractor -- never fabricated, never derived from this
      # section page's crawl time.
      - https://www.ft.com/technology
    source_type: secondary
    priority: high
    # Routes to the AI/Technology specialist (AgentName.AI_PRODUCT), not
    # the generic FinancialNewsAgent -- see agents.router.ArticleRouter's
    # research_domain-aware secondary-source case. FT's technology/AI
    # coverage is specifically what the AI/Technology specialist's own
    # prompt (ai_product_system.md) is tuned to judge.
    research_domain: ai_technology
    # Additive discovery via FT's own search (retrieval.ft_search): the AI
    # topic hub page alone is a limited, HTTP-only-visible slice (ranked/
    # truncated to max_candidates_per_source) and can miss relevant current
    # articles. Terms are aligned with config/topics.yaml's existing AI +
    # financial-services vocabulary (not duplicated wholesale) plus the
    # cross-domain AI/finance phrases that vocabulary keeps as separate
    # concepts. top_k_per_query is this crawler's own limit on how many
    # search results to take per term -- unrelated to agents.top_k, which
    # separately controls how many candidates reach the LLM.
    search:
      enabled: true
      top_k_per_query: 5
      search_terms:
        - AI
        - artificial intelligence
        - generative AI
        - AI agents
        - fintech
        - financial technology
        - banking technology
        - AI banking
        - AI financial services
        - AI capital markets
        - AI trading
        - AI investment
        - AI asset management

  - name: Barron's
    domain: barrons.com
    urls:
      - https://www.barrons.com/topics/artificial-intelligence
    source_type: secondary
    priority: medium

  - name: Wall Street Journal
    domain: wsj.com
    urls:
      - https://www.wsj.com/tech/ai
      # Official WSJ/Dow Jones RSS feed -- confirmed HTTP 200
      # application/rss+xml (2026-10-04 live check). wsj.com's own pages
      # return HTTP 401 to automated clients (confirmed anti-bot block, not
      # a connectivity issue); this feed is WSJ's own publicly syndicated
      # discovery channel and is not a paywall/anti-bot bypass of any kind.
      - https://feeds.a.dj.com/rss/RSSWSJD.xml
    source_type: secondary
    priority: high

  - name: TechCrunch
    domain: techcrunch.com
    urls:
      - https://techcrunch.com/category/artificial-intelligence/
    source_type: secondary
    priority: medium

  - name: The Information
    domain: theinformation.com
    urls:
      - https://www.theinformation.com/
    source_type: secondary
    priority: medium

  - name: PR Newswire
    domain: prnewswire.com
    urls:
      # Forensic finding (run 8704470a4a623d72): the previous
      # "...-artificial-intelligence-list/" URL links to 259+ other
      # category/topic LISTING pages alongside its ~25 real releases, and a
      # run can discover only those category pages if they happen to rank
      # first. This page is PR Newswire's own topic index for AI releases
      # specifically; discovery now also requires the release's own
      # numeric-ID URL shape (see retrieval.discovery's
      # `_is_pr_newswire_release_url`), so category/topic links from either
      # page are rejected regardless of which page is configured here.
      - https://www.prnewswire.com/news-releases/latest-news-topics/artificial-intelligence/
    source_type: press_distribution
    priority: medium
    # Routes to the Startup/Funding specialist (AgentName.STARTUP), not the
    # generic FinancialNewsAgent -- see agents.router.ArticleRouter's
    # research_domain-aware secondary-source case. PR Newswire's own
    # discovery page here is a listing of individual press releases (funding
    # rounds, launches, partnerships, acquisitions); each release remains an
    # independent candidate, never collapsed into "the whole feed".
    research_domain: startup_funding

  - name: Yahoo Finance
    domain: finance.yahoo.com
    urls:
      # Live-confirmed: every page on this domain, including this one, is a
      # client-side-rendered React shell whose plain HTML contains only nav
      # links (dozens of "/topic/<x>/"-style category pages), never a real
      # article -- real article links (e.g. ".../markets/stocks/article/
      # tsmc-posts-record-profit-amid-extremely-robust-demand-for-ai-chips-
      # <id>.html") only exist in the post-JS DOM. `retrieval.service`'s
      # `_YAHOO_FINANCE_DOMAIN` override forces browser-rendered discovery
      # for this domain unconditionally (the normal "zero candidates"
      # fallback trigger never fires here, since the nav noise itself
      # still counts as "candidates").
      - https://finance.yahoo.com/topic/artificial-intelligence/
    source_type: secondary
    priority: high

  - name: TradingView
    domain: tradingview.com
    urls:
      # Live-confirmed: this page's plain HTML already lists 100+ real,
      # individually dated syndicated wire articles (Dow Jones Newswires,
      # Barron's, Business Wire, ...) at "/news/<id>:0-<slug>/" -- no
      # browser rendering needed, unlike Yahoo Finance above.
      - https://www.tradingview.com/news/
    source_type: secondary
    priority: high

