retrieval_policy:

  primary_source_priority:
    - official_press_release
    - official_newsroom
    - official_blog
    - official_research
    - official_product_page

  secondary_source_priority:
    - Reuters
    - Bloomberg
    - Financial Times
    - Wall Street Journal
    - CNBC
    - Barron's
    - TechCrunch
    - Yahoo Finance
    - TradingView

  blocked_behavior:
    paywall: do_not_bypass
    authentication: do_not_bypass
    robots_txt: respect
    anti_bot: do_not_bypass